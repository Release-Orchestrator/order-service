replicaCount: 1

image:
  repository: ghcr.io/release-orchestrator/order-service
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80

containerPort: 8080

env:
  PORT: "8080"
  DB_HOST: "order-db"
  DB_PORT: "5432"
  DB_USER: "postgres"
  DB_PASS: "postgres"
  DB_NAME: "order_db"
  USER_SERVICE_URL: "http://user-service:8080"
  PAYMENT_SERVICE_URL: "http://payment-service:8080"

resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi
